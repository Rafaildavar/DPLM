# -----------------------------------------------------------------------------
# Docker services для GestureBind.
#
# Старт:
#   docker compose up -d db
#   docker compose --profile tools run --rm ml-smoke
#   docker compose --profile tools run --rm ci
#   docker compose --profile tools up mlflow
#
# Важно: Docker здесь нужен для воспроизводимого ML/runtime окружения,
# smoke-проверок и CD-артефактов. Интерактивное desktop-приложение с камерой
# лучше распространять как нативный release archive.
#
# Подключение из приложения берётся из переменных окружения /
# из файла .env (см. .env.example).
#
# Данные — в именованном Docker-томе ``dplm_postgres_data``: это стабильнее,
# чем bind-mount для внутренних файлов PostgreSQL.
# Старый путь ``./.db_data/postgres`` больше не используется — каталог можно удалить.
# -----------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: dplm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DPLM_DB_USER:-dplm}
      POSTGRES_PASSWORD: ${DPLM_DB_PASSWORD:-dplm}
      POSTGRES_DB: ${DPLM_DB_NAME:-dplm}
      # Хранить данные в подпапке внутри тома, чтобы можно было
      # легко удалять корень тома.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DPLM_DB_PORT:-5432}:5432"
    volumes:
      - dplm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${DPLM_DB_USER:-dplm} -d ${DPLM_DB_NAME:-dplm}"
      interval: 5s
      timeout: 3s
      retries: 10

  ml-smoke:
    profiles: ["tools"]
    platform: linux/amd64
    build:
      context: .
      target: runtime
    image: gesturebind-runtime:local
    command: make ml-smoke
    environment:
      PYTHON: python
      CI_ARTIFACT_DIR: /app/outputs/ci
      DPLM_DB_BACKEND: sqlite
      DPLM_SQLITE_PATH: /app/.runtime/dplm.sqlite
    volumes:
      - ./outputs:/app/outputs

  ci:
    profiles: ["tools"]
    platform: linux/amd64
    build:
      context: .
      target: runtime
    image: gesturebind-runtime:local
    command: make ci
    environment:
      PYTHON: python
      CI_ARTIFACT_DIR: /app/outputs/ci
      DPLM_DB_BACKEND: sqlite
      DPLM_SQLITE_PATH: /app/.runtime/dplm.sqlite
    volumes:
      - ./outputs:/app/outputs

  mlflow:
    profiles: ["tools"]
    platform: linux/amd64
    build:
      context: .
      target: runtime
    image: gesturebind-runtime:local
    command: >
      python -m mlflow ui
      --backend-store-uri sqlite:////app/mlflow/mlflow.db
      --host 0.0.0.0
      --port 5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - gesturebind_mlflow:/app/mlflow

volumes:
  dplm_postgres_data:
  gesturebind_mlflow:
