name: Desktop Release Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Build desktop handoff bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source and model bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          BUNDLE="gesturebind-${VERSION}.tar.gz"
          tar \
            --exclude=".git" \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude="node_modules" \
            --exclude="data/raw" \
            --exclude="data/external" \
            --exclude="data/experiments" \
            --exclude="outputs" \
            --exclude="htmlcov" \
            --exclude="mlruns" \
            --exclude="mlflow.db" \
            -czf "$BUNDLE" .
          mkdir -p outputs/release
          mv "$BUNDLE" outputs/release/

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-bundle
          path: outputs/release/*.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" outputs/release/*.tar.gz --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "GestureBind ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              outputs/release/*.tar.gz \
              --title "GestureBind ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
