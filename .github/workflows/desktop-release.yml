name: Desktop Release Bundle

on:
  push:
    branches:
      - contest_version
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Build desktop handoff bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tree
        run: python -m scripts.check_repository_hygiene

      - name: Build source and model bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          BUNDLE="gesturebind-${VERSION}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="gesturebind-${VERSION}/" \
            --output="$BUNDLE" \
            HEAD
          mkdir -p outputs/release
          mv "$BUNDLE" outputs/release/

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-bundle
          path: outputs/release/*.tar.gz

  macos-app:
    name: Build macOS app
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<82" wheel
          python -m pip install -r requirements.txt

      - name: Run ML smoke before packaging
        run: |
          python -m scripts.ml_smoke \
            --report-json outputs/ci/ml_smoke_report.json

      - name: Build macOS app artifacts
        env:
          GESTUREBIND_VERSION: ${{ github.ref_name }}
          GESTUREBIND_TELEMETRY_ENDPOINT: ${{ vars.GESTUREBIND_TELEMETRY_ENDPOINT }}
          GESTUREBIND_TELEMETRY_PROJECT_KEY: ${{ vars.GESTUREBIND_TELEMETRY_PROJECT_KEY }}
        run: bash packaging/macos/build_app.sh

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesturebind-macos-app
          path: |
            outputs/release/*.dmg
            outputs/release/*.zip
          if-no-files-found: error

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-packaging-diagnostics
          path: |
            outputs/ci/
            build/**/warn-*.txt
          if-no-files-found: ignore

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - bundle
      - macos-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source bundle
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-bundle
          path: outputs/release

      - name: Download macOS app
        uses: actions/download-artifact@v4
        with:
          name: gesturebind-macos-app
          path: outputs/release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" outputs/release/* --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "GestureBind ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              outputs/release/* \
              --title "GestureBind ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
