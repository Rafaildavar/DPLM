name: Main Sequential CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 1. Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHON: python
        run: make test-unit-ci

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ci-artifacts
          path: outputs/ci/
          if-no-files-found: ignore

  ml-smoke:
    name: 2. ML smoke
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ML smoke
        env:
          PYTHON: python
        run: make ml-smoke

      - name: Upload ML smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ml-smoke-report
          path: outputs/ci/ml_smoke_report.json
          if-no-files-found: error

  docker-runtime:
    name: 3. Docker runtime
    needs: ml-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --platform linux/amd64 -t gestureflow-runtime:${{ github.sha }} .

      - name: Run ML smoke inside container
        run: |
          docker run --rm --platform linux/amd64 \
            -e CI_ARTIFACT_DIR=/app/outputs/ci \
            gestureflow-runtime:${{ github.sha }} \
            make ml-smoke

      - name: Export image metadata
        if: always()
        run: |
          mkdir -p outputs/docker
          docker image inspect gestureflow-runtime:${{ github.sha }} \
            > outputs/docker/image-inspect.json

      - name: Upload Docker metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-docker-runtime-metadata
          path: outputs/docker/
          if-no-files-found: ignore
