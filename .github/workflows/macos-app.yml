name: macOS App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - contest_version
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - "cv/**"
      - "models/**"
      - "configs/**"
      - "alembic/**"
      - "requirements.txt"
      - "Makefile"
      - "packaging/macos/**"
      - ".github/workflows/macos-app.yml"

permissions:
  contents: write

jobs:
  macos-app:
    name: Build macOS app artifact
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run ML smoke before packaging
        run: |
          python -m scripts.ml_smoke \
            --report-json outputs/ci/ml_smoke_report.json

      - name: Build macOS app zip
        env:
          GESTUREFLOW_VERSION: ${{ github.ref_name }}
        run: bash packaging/macos/build_app.sh

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestureflow-macos-app
          path: outputs/release/*.zip
          if-no-files-found: error

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-packaging-diagnostics
          path: |
            outputs/ci/
            build/**/warn-*.txt
          if-no-files-found: ignore

      - name: Attach macOS app to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            outputs/release/*.zip \
            --draft \
            --title "GestureFlow ${GITHUB_REF_NAME}" \
            --notes "macOS app bundle with tracked model artifacts and configs." \
          || gh release upload "${GITHUB_REF_NAME}" outputs/release/*.zip --clobber
