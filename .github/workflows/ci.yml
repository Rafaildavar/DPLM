name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - contest_version
      - dev

permissions:
  contents: read

jobs:
  unit-and-smoke:
    name: Unit tests and ML smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run CI checks
        env:
          PYTHON: python
        run: make ci

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: outputs/ci/
          if-no-files-found: ignore
