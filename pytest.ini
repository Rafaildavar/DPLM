[pytest]
# Конфигурация pytest для проекта DPLM / pytest configuration for DPLM project

# Директории для поиска тестов / Test discovery directories
testpaths = tests

# Шаблон имён тестовых файлов / Test file name pattern
python_files = test_*.py

# Шаблон имён тестовых классов / Test class name pattern
python_classes = Test*

# Шаблон имён тестовых функций / Test function name pattern
python_functions = test_*

# Опции по умолчанию / Default options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov=cv
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=90

# Маркеры для категоризации тестов / Markers for test categorization
markers =
    unit: Unit tests (изолированные тесты функций / isolated function tests)
    integration: Integration tests (тесты взаимодействия компонентов / component interaction tests)
    ui: UI tests (тесты интерфейса / interface tests)
    slow: Slow tests (медленные тесты / slow running tests)
    cv: Computer vision tests (тесты CV модулей / CV module tests)
    ml: Machine learning tests (тесты ML моделей / ML model tests)
    db: Database tests (тесты БД / database tests)

